<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D4F3B" />
      <stop offset="1" stop-color="#1A2419" />
    </linearGradient>
    <radialGradient id="bloomA" cx="0.18" cy="0.32" r="0.45">
      <stop offset="0" stop-color="rgba(194,150,58,0.55)" />
      <stop offset="1" stop-color="rgba(194,150,58,0)" />
    </radialGradient>
    <radialGradient id="bloomB" cx="0.82" cy="0.78" r="0.5">
      <stop offset="0" stop-color="rgba(232,213,163,0.32)" />
      <stop offset="1" stop-color="rgba(232,213,163,0)" />
    </radialGradient>
    <linearGradient id="grain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0)" />
      <stop offset="0.5" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="1" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <rect width="1920" height="720" fill="url(#bg)" />
  <rect width="1920" height="720" fill="url(#bloomA)" />
  <rect width="1920" height="720" fill="url(#bloomB)" />

  <!-- Soft therapist-circle abstract (two figures meeting across a table — visual rhyme, not literal). -->
  <g stroke="rgba(232,213,163,0.55)" stroke-width="1.3" fill="none">
    <circle cx="780" cy="380" r="58" />
    <circle cx="780" cy="380" r="40" stroke-opacity="0.55" />
    <circle cx="1140" cy="380" r="58" />
    <circle cx="1140" cy="380" r="40" stroke-opacity="0.55" />
    <path d="M 840 380 q 60 -40 120 0 q 60 40 120 0" stroke-opacity="0.7" />
    <path d="M 740 460 q 100 60 200 60 q 100 0 200 -60" stroke-opacity="0.42" />
    <path d="M 740 300 q 100 -60 200 -60 q 100 0 200 60" stroke-opacity="0.42" />
  </g>

  <!-- Distant horizon line -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="rgba(232,213,163,0.18)" stroke-width="1" stroke-dasharray="2 14" />

  <!-- Atmospheric grain overlay -->
  <rect width="1920" height="720" fill="url(#grain)" opacity="0.25" />

  <!-- Distant silhouettes — abstract clinicians, no photographs -->
  <g fill="rgba(232,213,163,0.18)">
    <circle cx="200" cy="540" r="18" />
    <rect x="184" y="558" width="32" height="60" rx="6" />

    <circle cx="320" cy="560" r="14" />
    <rect x="308" y="574" width="24" height="42" rx="4" />
  </g>
  <g fill="rgba(194,150,58,0.18)">
    <circle cx="1620" cy="560" r="16" />
    <rect x="1606" y="576" width="28" height="50" rx="5" />
  </g>
</svg>
