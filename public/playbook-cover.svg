<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" fill="none">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D4F3B" />
      <stop offset="0.55" stop-color="#2D3B2C" />
      <stop offset="1" stop-color="#1A2419" />
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(0,0,0,0.45)" />
      <stop offset="1" stop-color="rgba(0,0,0,0)" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2963A" />
      <stop offset="1" stop-color="#E8D5A3" />
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Soft paper edge -->
  <rect x="6" y="6" width="514" height="668" rx="6" fill="#F0EDE6" />
  <rect x="6" y="6" width="514" height="668" rx="6" fill="rgba(0,0,0,0.04)" />

  <!-- Main cover -->
  <rect x="0" y="0" width="520" height="680" rx="6" fill="url(#cover)" />

  <!-- Subtle grain texture (decorative lines on the right) -->
  <g stroke="rgba(194,150,58,0.10)" stroke-width="1" fill="none">
    <line x1="380" y1="540" x2="500" y2="540" />
    <line x1="380" y1="556" x2="500" y2="556" />
    <line x1="380" y1="572" x2="500" y2="572" />
    <line x1="380" y1="588" x2="500" y2="588" />
  </g>

  <!-- Spine highlight -->
  <rect x="0" y="0" width="36" height="680" fill="url(#spine)" />

  <!-- Top brand bar -->
  <g transform="translate(70 100)">
    <text
      font-family="Georgia, serif"
      font-size="13"
      font-weight="500"
      letter-spacing="0.34em"
      fill="#C2963A"
    >AUSTIN CLINICIAN CIRCLE</text>
    <line x1="0" y1="18" x2="44" y2="18" stroke="#C2963A" stroke-width="1.5" />
  </g>

  <!-- Title -->
  <g transform="translate(70 200)">
    <text
      font-family="Georgia, serif"
      font-size="56"
      font-weight="400"
      fill="#FFFFFF"
      letter-spacing="-0.015em"
    >The Private</text>
    <text
      y="58"
      font-family="Georgia, serif"
      font-size="56"
      font-weight="400"
      fill="#FFFFFF"
      letter-spacing="-0.015em"
    >Practice</text>
    <text
      y="120"
      font-family="Georgia, serif"
      font-style="italic"
      font-size="56"
      font-weight="400"
      fill="#E8D5A3"
      letter-spacing="-0.015em"
    >Playbook</text>
  </g>

  <!-- Amber accent bar -->
  <g transform="translate(70 410)">
    <rect width="68" height="3" fill="url(#accent)" />
  </g>

  <!-- Subtitle -->
  <g transform="translate(70 440)">
    <text
      font-family="Georgia, serif"
      font-size="15"
      fill="rgba(255,255,255,0.78)"
      font-style="italic"
    >A practical guide for licensed</text>
    <text
      y="22"
      font-family="Georgia, serif"
      font-size="15"
      fill="rgba(255,255,255,0.78)"
      font-style="italic"
    >therapists building sustainable</text>
    <text
      y="44"
      font-family="Georgia, serif"
      font-size="15"
      fill="rgba(255,255,255,0.78)"
      font-style="italic"
    >private practice.</text>
  </g>

  <!-- Footer mark -->
  <g transform="translate(70 612)">
    <text
      font-family="Georgia, serif"
      font-size="11"
      letter-spacing="0.3em"
      fill="rgba(232,213,163,0.7)"
    >FOUNDED BY SARAH ARNOLD, LPC-S</text>
  </g>

  <!-- Hand-drawn circle motif (cover decoration, not the homepage circle pattern) -->
  <g transform="translate(360 270)" stroke="rgba(194,150,58,0.42)" fill="none" stroke-width="1.3">
    <circle cx="0" cy="0" r="60" />
    <circle cx="0" cy="0" r="40" stroke-opacity="0.55" />
    <line x1="-60" y1="0" x2="60" y2="0" stroke-opacity="0.4" />
    <line x1="0" y1="-60" x2="0" y2="60" stroke-opacity="0.4" />
  </g>
</svg>
